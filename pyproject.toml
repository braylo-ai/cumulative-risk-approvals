[project]
name = "cumulative-risk-approvals"
version = "0.1.0"
description = "Per-step and cumulative risk approval engine with scoped TTL grants, batching and consent-fatigue metrics"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
